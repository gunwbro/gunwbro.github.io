---
layout: default
---

<h1>{{ page.title }}</h1>

<ul>
  {% assign category_name = page.category %}
  {% for post in site.posts %}
    {% if post.categories contains category_name %}
      <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> {{ post.date | date_to_string }}</li>
    {% endif %}
  {% endfor %}
</ul>
